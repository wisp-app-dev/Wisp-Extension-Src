name: Dézipper Wisp

on:
  push:
    paths:
      - "wisp-1.7.2.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Dézippe wisp-1.7.2.zip dans un dossier qui garde le même nom : wisp-1.7.2/
      - name: Dézipper
        run: |
          rm -rf wisp-1.7.2
          unzip -q wisp-1.7.2.zip -d wisp-1.7.2
          ls wisp-1.7.2

      # Enregistre le dossier dans le dépôt
      - name: Commit du dossier
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add wisp-1.7.2
          git diff --cached --quiet || git commit -m "Dézip de wisp-1.7.2.zip"
          git push
