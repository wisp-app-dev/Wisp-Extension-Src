name: Renommer le dossier

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Renommer extension en Wisp-1.7.1
        run: |
          [ -d extension ] || { echo "::error::Le dossier extension n'existe pas"; exit 1; }
          git mv extension Wisp-1.7.1
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git commit -m "Renommage : extension -> Wisp-1.7.1"
          git push
