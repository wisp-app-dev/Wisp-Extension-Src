name: Build Wisp APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Décompresser le zip
        run: |
          ls -la
          unzip -q wisp-github-project.zip
          ls -la repo repo/app repo/base

      - name: Patch hosts.txt dans l'APK
        run: python3 repo/scripts/patch_apk.py repo/base/Wisp-base.apk repo/app/hosts.txt unsigned.apk

      - name: Zipalign + signature
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > release.keystore
            KS=release.keystore; PASS="$KS_PASS"; ALIAS="$KS_ALIAS"
          else
            KS=repo/keystore/wisp.keystore; PASS=wisp1234; ALIAS=wisp
          fi
          "$BT/zipalign" -f -p 4 unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks "$KS" --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --ks-key-alias "$ALIAS" --out Wisp.apk aligned.apk
          "$BT/apksigner" verify --verbose Wisp.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Wisp-apk
          path: Wisp.apk

      - name: Release latest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Wisp (dernier build)
          files: Wisp.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
